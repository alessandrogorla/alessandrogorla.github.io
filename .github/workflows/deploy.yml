name: Deploy to GitHub Pages

on:
  push:
    branches: [ main ] # o master

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: write # <-- Fondamentale per dare i permessi al bot
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22 # Aggiornato per evitare il warning di Node 20
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Deploy
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./build